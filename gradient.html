<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: aquamarine;
        }
        p{
            color: blueviolet;
            font-size: 1in;
            background: linear-gradient(rgb(1, 5, 249),rgb(105, 9, 232),purple,midnightblue,rgb(5, 82, 86),rgb(65, 132, 154));
        }
        div{
            height: 300px;
            width: 300px;
            margin: 30px;
            float: left;
        } 
    </style>
</head>
<body>
   <p>Ми вивчаемо градієнти</p> 
   <div style="background:linear-gradient(yellow,blue);"></div>
   <div style="background:linear-gradient(to right,yellow,blue);"></div>
   <div style="background:linear-gradient(45deg,yellow,blue);"></div>
   <div style="background:linear-gradient(225deg,yellow,blue);"></div>
   <div style="background:linear-gradient(45deg,yellow 50%,blue 50%);"></div>
   <div style="background:linear-gradient(45deg,yellow 25%,blue 75%);"></div>
   <div style="background:linear-gradient(360deg,yellow 50%,blue 50%);width: 450px;"></div>
   <div style="background:linear-gradient(red 25%,blue 25% 50%,yellow 50% 75%,green 75%);width: 450px;"></div>
    <div style="background:linear-gradient(red 25%,darkblue 50%,yellow 75%,darkgreen 100%);width: 450px;"></div>
    <div style="background:radial-gradient(yellow,blue);"></div>
    <div style="background:radial-gradient(yellow 30%,blue);"></div>
    <div style="background:radial-gradient(yellow 30%,blue 70%);border-radius: 25%;"></div>
    <div style="background:radial-gradient(yellow 30%,blue 70%);border-radius: 50%;"></div>
    <div style="background:radial-gradient(circle at 50% 0%, yellow 30%,blue 70%);border-radius: 0%;"></div>
     <div style="background:radial-gradient(red 25%,darkblue 50%,yellow 75%,darkgreen 100%);"></div>
    <div style="background: radial-gradient(closest-side, #3f87a6, #ebf8e1, #f69d3c);"></div>
    <div style="background:radial-gradient(circle, red 25%,darkblue 25% 50%,yellow 50% 75%,darkgreen 75% 100%);width: 450px;"></div>
<div style="background:conic-gradient(yellow,blue);"></div>
<div style="background:conic-gradient(at 25% 25%, yellow,blue);"></div>
<div style="background:conic-gradient(at 75% 75%, yellow,blue);"></div>
 <div style="background:conic-gradient( green 15%, black 15% 30%, gold 30% 45%, red 45% 60% ,darkblue 60% 75%,yellow 75% 90%,darkgreen 90% 100%);width: 450px;"></div>
<div style="background:repeating-linear-gradient(yellow 10%,blue 20%);"></div>
<div style="background:repeating-linear-gradient(45deg, yellow 10%,blue 20%);"></div>
<div style="background:repeating-radial-gradient(yellow 10%,blue 20%);"></div>
<div style="background:repeating-radial-gradient(yellow 10%,blue 20%);border-radius: 50%;"></div>
<div style="background:repeating-conic-gradient(yellow 10%,blue 20%);"></div>
<div style="background:repeating-conic-gradient( green 10%,black 20%, gold 30%, red 40% ,darkblue 50%,yellow 60%,darkgreen 70%);width: 450px;"></div>
<div style="
    width: 400px; 
    height: 400px; 
    background: conic-gradient(
        #008000 90deg, 
        #000000 90deg 180deg, 
        #008000 180deg 270deg, 
        #000000 270deg
    );
    background-size: 100px 100px;
    border: 5px solid #333;
"></div>
<div style="
    width: 400px; 
    height: 400px; 
    background: 
        conic-gradient(from 0deg at 50% 50%, #f00 60deg, #000 60deg 120deg, #ffd700 120deg 180deg, #008000 180deg 240deg, #0000ff 240deg 300deg, #fff 300deg);
    background-size: 50px 86.6px;
"></div>
<div style="
    width: 400px; 
    height: 400px; 
    background: 
        repeating-radial-gradient(circle at center, transparent 0 10%, rgba(0,0,0,0.2) 10% 20%),
        conic-gradient(yellow, blue, yellow, blue, yellow);
"></div>
<div style="
    width: 400px; 
    height: 400px; 
    background: repeating-radial-gradient(
        circle at 0% 0%, 
        #ffd700 0 20px, 
        #00008b 20px 40px
    );
"></div>


</body>
</html>
